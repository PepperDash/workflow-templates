name: Essentials Plugin Build Get Version

on:
  workflow_call:
    outputs:
      version:
        description: 'The version of the workflow'
        value: ${{ jobs.GetVersionNumber.outputs.version }}
      tag:
        description: 'The tag of the workflow'
        value: ${{ jobs.GetVersionNumber.outputs.tag }}
      newVersion:
        description: 'Was a new version generated?'
        value: ${{ jobs.GetVersionNumber.outputs.newVersion }}
      channel:
        description: 'The channel of the workflow'
        value: ${{ jobs.GetVersionNumber.outputs.channel }}
jobs:
  GetVersionNumber:
    runs-on: ubuntu-latest
    outputs:
      newVersion: ${{ steps.get_version.outputs.newVersion }}
      tag: ${{ steps.get_version.outputs.tag }}
      version: ${{ steps.get_version.outputs.version }}
      channel: ${{ steps.get_version.outputs.channel }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
    - name: Get branch name
      id: get_branch
      run: |
        branch=${GITHUB_REF#refs/heads/}
        echo "branch=$branch" >> $GITHUB_OUTPUT
        echo "prerelease=${branch//\//-}" >> $GITHUB_OUTPUT
      env:
        GITHUB_REF: ${{ github.ref }}
    - name: Replace branch name in .releaserc.json
      if: steps.get_branch.outputs.branch != 'main'
      uses: jacobtomlinson/gha-find-replace@master
      with:
        find: 'replace-me-feature-branch'
        replace: '${{ steps.get_branch.outputs.branch }}'
        include: '.releaserc.json'
    - name: Replace prerelease name in .releaserc.json
      if: steps.get_branch.outputs.branch != 'main'
      uses: jacobtomlinson/gha-find-replace@master
      with:
        find: 'replace-me-prerelease'
        replace: '${{ steps.get_branch.outputs.prerelease }}'
        include: '.releaserc.json'
    - name: Get version number
      id: get_version
      # conventional-changelog-conventionalcommits is pinned to 9. From 10.0.0 it depends on
      # @conventional-changelog/template, and template 1.4.0 (published 2026-08-18) refuses to
      # render unless the loaded writer is >= 9 - it ships a main template of
      # "{{[<preset> requires conventional-changelog-writer@9 or newer...]}}", so Handlebars fails
      # with `Missing helper: "<that sentence>"`. @semantic-release/release-notes-generator@14.1.1
      # still depends on conventional-changelog-writer ^8, so any repo whose .releaserc.json asks
      # for the conventionalcommits preset broke overnight with no change on either side. 9.3.1 has
      # no @conventional-changelog/template dependency at all, so there is no guard to trip.
      # Revisit when release-notes-generator moves to writer >= 9.
      run: npx --package=semantic-release --package=@semantic-release/commit-analyzer --package=@semantic-release/release-notes-generator --package=@semantic-release/changelog --package=@semantic-release/exec --package=conventional-changelog-conventionalcommits@9 -- semantic-release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN}}
    - name: Print summary if no new version
      if: steps.get_version.outputs.newVersion != 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN}}
      run: |          
        echo "# Summary" >> $GITHUB_STEP_SUMMARY
        echo "No new version generated" >> $GITHUB_STEP_SUMMARY
    - name: Upload release notes
      if: steps.get_version.outputs.newVersion == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: change-log
        path: CHANGELOG.md
    - name: Upload Release
      id: create_release
      if: steps.get_version.outputs.newVersion == 'true'
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true 
        prerelease: ${{ steps.get_version.outputs.channel != '' }}
        tag: ${{ steps.get_version.outputs.tag }}
        commit: ${{ github.sha }}
        bodyFile: ./CHANGELOG.md
    - name: Print results
      if: steps.get_version.outputs.newVersion == 'true'
      run: |
        echo "# Summary" >> $GITHUB_STEP_SUMMARY        
        echo "Version: ${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "Tag: ${{ steps.get_version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
        echo "New Version: ${{ steps.get_version.outputs.newVersion }}" >> $GITHUB_STEP_SUMMARY
        echo "Channel: ${{ steps.get_version.outputs.channel }}" >> $GITHUB_STEP_SUMMARY
        echo "Type: ${{ steps.get_version.outputs.type }}" >> $GITHUB_STEP_SUMMARY
