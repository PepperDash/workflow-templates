name: Self-test (actions & workflows)

# CI for THIS repo only. Runs the offline unit-test suite for the composite
# actions, the workflow-structure guardrails, the SchemaGen tool, and actionlint.
# Publishes nothing and builds nothing for downstream consumers.

on:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Run the suite
        shell: pwsh
        run: pwsh tests/run-all.ps1

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
