name: Get project info
description: >
  Derives make / model / title / NuGet package id from the repository name using
  the PepperDash EPI naming convention (org/epi-make-model[-variant]).

inputs:
  package-prefix:
    description: 'NuGet id prefix for plugin repos.'
    required: false
    default: 'PepperDash.Essentials.Plugin.'

outputs:
  make:
    description: 'Manufacturer segment.'
    value: ${{ steps.parse.outputs.make }}
  model:
    description: 'Model segment (empty for non-plugin repos).'
    value: ${{ steps.parse.outputs.model }}
  title:
    description: 'Human-readable title.'
    value: ${{ steps.parse.outputs.title }}
  package:
    description: 'NuGet package id.'
    value: ${{ steps.parse.outputs.package }}
  repo-is-plugin:
    description: '"true" when the repo name resolves to a plugin (make + model).'
    value: ${{ steps.parse.outputs.repo-is-plugin }}
  repo-name:
    description: 'Repository name without the owner.'
    value: ${{ steps.parse.outputs.repo-name }}

runs:
  using: composite
  steps:
    - name: Parse repository name
      id: parse
      shell: pwsh
      run: |
        $repoFullName = "${{ github.repository }}"
        $repoName = $repoFullName.Split('/')[-1]
        $makeModelParts = $repoName -split '-'

        switch ($makeModelParts.Count) {
          0 { Write-Error "Expected information not found, verify repository name."; exit 1 }
          1 { $make = $makeModelParts[0].Replace(' ', ''); $model = '' }
          2 { $make = $makeModelParts[0].Replace(' ', ''); $model = $makeModelParts[1].Replace(' ', '') }
          default {
            # org/epi-make-model[-variant]
            $make  = $makeModelParts[1].Replace(' ', '')
            $model = ($makeModelParts[2..($makeModelParts.Count - 1)] -join '').Replace(' ', '')
          }
        }

        if ($model -eq '') {
          $title = $make
          $package = $title -replace ' ', ''
          $repoIsPlugin = $false
        }
        else {
          $title = (Get-Culture).TextInfo.ToTitleCase("$make") + (Get-Culture).TextInfo.ToTitleCase("$model")
          $package = "${{ inputs.package-prefix }}" + ($title -replace ' ', '')
          $repoIsPlugin = $true
        }

        Write-Output "Repo Name: $repoName"
        Write-Output "Make: $make"
        Write-Output "Model: $model"
        Write-Output "Title: $title"
        Write-Output "Package: $package"
        Write-Output "Repo is Plugin: $repoIsPlugin"

        "repo-name=$repoName"                     | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "make=$make"                              | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "model=$model"                            | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "title=$title"                            | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "package=$package"                        | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "repo-is-plugin=$($repoIsPlugin.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

        # Also surface as env vars for downstream inline steps that still read them.
        "REPO_NAME=$repoName"                     | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "REPO_FULL_NAME=$repoFullName"            | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "REPO_IS_PLUGIN=$repoIsPlugin"            | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "EPI_TITLE=$title"                        | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "EPI_PACKAGE=$package"                    | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
