name: Copy build output
description: >
  Collects build artifacts (.cpz/.clz/.cplz and their matching .dll) from the
  solution tree into ./output and renames them to embed the version. Parameterised
  to cover both the Essentials/Core and plugin variants.

inputs:
  version:
    description: 'Version string to embed in artifact names.'
    required: true
  build-type:
    description: 'Release or Debug.'
    required: true
  package:
    description: 'NuGet package id (used to also match a renamed primary .dll).'
    required: false
    default: ''
  extensions:
    description: 'Space-separated artifact extensions, with leading dots.'
    required: false
    default: '.cpz .clz .cplz'
  include-dll:
    description: 'Also collect all .dll files alongside the artifacts (Essentials/Core).'
    required: false
    default: 'false'
  bin-filter:
    description: >
      "bin" matches any bin dir; "bin-config" restricts to \bin\<build-type>\.
    required: false
    default: 'bin-config'
  rename-mode:
    description: >
      "all" renames every collected artifact/.dll (plugin). "essentials" renames
      only PepperDashEssentials / PepperDashCore / PepperDash_Core and strips the
      ".3Series" moniker; other files (incl. .dll) keep their names.
    required: false
    default: 'all'
  copy-nuspec:
    description: 'Copy any pre-existing .nuspec to the repo root and export NUSPEC_FILE.'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Copy and rename output
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $summary = $env:GITHUB_STEP_SUMMARY
        try {
          Add-Content -Path $summary -Value "## Copy build output files`n"

          $sourceDir = "$env:GITHUB_WORKSPACE"
          $destinationDir = Join-Path $sourceDir "output"
          $version = "${{ inputs.version }}"
          $package = "${{ inputs.package }}"
          $renameMode = "${{ inputs.rename-mode }}"

          if ([string]::IsNullOrWhiteSpace($version)) { throw "No version supplied." }

          $validExtensions = "${{ inputs.extensions }}".Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries)
          if ($validExtensions.Count -eq 0) { throw "No artifact extensions supplied." }
          if ("${{ inputs.include-dll }}" -eq "true") { $validExtensions += ".dll" }
          $includePatterns = $validExtensions | ForEach-Object { "*$_" }

          if ("${{ inputs.bin-filter }}" -eq "bin-config") {
            $binRegex = "\\bin\\${{ inputs.build-type }}"
          } else {
            $binRegex = "\\bin\\"
          }

          Write-Output "Extensions: $($validExtensions -join ', ')  Bin filter: $binRegex  Version: $version"

          if (Test-Path -Path $destinationDir) {
            Get-ChildItem -Path $destinationDir -Recurse | Remove-Item -Force -Recurse
          } else {
            New-Item -ItemType Directory -Force -Path $destinationDir | Out-Null
          }

          if ("${{ inputs.copy-nuspec }}" -eq "true") {
            Get-ChildItem -Path $sourceDir -Recurse -Filter *.nuspec | ForEach-Object {
              Write-Output "Copying $($_.Name) to repo root"
              Copy-Item $_.FullName -Destination .\ -Force
              "NUSPEC_FILE=$($_.BaseName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

          $filesToCopy = Get-ChildItem -Path $sourceDir -Recurse -Include $includePatterns | Where-Object {
            -not $_.FullName.Contains("\packages\") -and $_.FullName -match $binRegex
          }

          if (@($filesToCopy).Count -eq 0) {
            $err = "No build artifacts ($($validExtensions -join ', ')) found under a path matching '$binRegex'. Did the build succeed?"
            Write-Error $err
            Add-Content -Path $summary -Value "❌ $err`n"
            exit 1
          }

          $allFilesToCopy = @()
          foreach ($file in $filesToCopy) {
            $allFilesToCopy += $file
            $allFilesToCopy += Get-ChildItem -Path $sourceDir -Recurse | Where-Object {
              ($_.BaseName -eq $file.BaseName -or ($package -ne '' -and $_.BaseName -eq $package)) -and $_.Extension -eq ".dll"
            }
          }
          $allFilesToCopy = $allFilesToCopy | Sort-Object FullName -Unique

          Write-Output "Copying $($allFilesToCopy.Count) file(s) to $destinationDir"
          $allFilesToCopy | ForEach-Object { Copy-Item $_.FullName -Destination $destinationDir -Force }

          # Which extensions get renamed. In "essentials" mode the DLLs keep their
          # names (matching the legacy essentials-3Series behaviour); only the
          # core .cpz/.clz are versioned.
          $renameExtensions = @($validExtensions)
          if ($renameMode -eq 'all' -and $renameExtensions -notcontains ".dll") {
            $renameExtensions += ".dll"
          }
          if ($renameMode -eq 'essentials') {
            $renameExtensions = $renameExtensions | Where-Object { $_ -ne ".dll" }
          }

          Get-ChildItem -Path $destinationDir | Where-Object { $renameExtensions -contains $_.Extension } | ForEach-Object {
            $oldName = $_.Name
            $baseName = $_.BaseName
            $extension = $_.Extension

            if ($renameMode -eq "essentials") {
              if ($baseName -match "PepperDashEssentials" -or $baseName -match "PepperDashCore" -or $baseName -match "PepperDash_Core") {
                $newName = ("$baseName.$version$extension" -replace '\.3Series', '')
                Write-Output "- '$oldName' -> '$newName'"
                Rename-Item -Path $_.FullName -NewName $newName -Force
              }
            }
            else {
              if ($baseName -match '(.+)\.3[Ss]eries$') {
                $newName = "$($Matches[1]).$version.3Series$extension"
              } else {
                $newName = "$baseName.$version$extension"
              }
              Write-Output "- '$oldName' -> '$newName'"
              Rename-Item -Path $_.FullName -NewName $newName -Force
            }
          }

          $final = Get-ChildItem -Path $destinationDir
          if (@($final).Count -eq 0) {
            $err = "Nothing was copied to $destinationDir."
            Write-Error $err
            Add-Content -Path $summary -Value "❌ $err`n"
            exit 1
          }
          $final | ForEach-Object { Add-Content -Path $summary -Value "- $($_.Name)`n" }
        }
        catch {
          $err = "copy-build-output failed: $($_.Exception.Message)"
          Write-Error $err
          Add-Content -Path $summary -Value "❌ $err`n"
          exit 1
        }
