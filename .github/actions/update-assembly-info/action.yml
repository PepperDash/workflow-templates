name: Update AssemblyInfo
description: >
  Rewrites AssemblyVersion / AssemblyInformationalVersion in every AssemblyInfo.cs
  and AssemblyInfo.vb under the workspace. For SDK-style (.NET 8) projects that set
  the version via /p:Version, skip this action.

inputs:
  version:
    description: 'Full version string (may include a prerelease suffix).'
    required: true

runs:
  using: composite
  steps:
    - name: Update AssemblyInfo files
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        $summary = $env:GITHUB_STEP_SUMMARY
        try {
          Add-Content -Path $summary -Value "## Update Assembly Info`n"

          if ([string]::IsNullOrWhiteSpace($env:VERSION)) {
            throw "No version supplied."
          }
          $r = [System.Text.RegularExpressions.Regex]::Match($env:VERSION, "\d+\.\d+\.\d+.*")
          if (-not $r.Success) {
            throw "Input version '$($env:VERSION)' does not match x.y.z format."
          }

          function Update-SourceVersion {
            Param ([string]$Version)
            $baseVersion = [regex]::Match($Version, "(\d+.\d+.\d+).*").captures.groups[1].value
            $NewAssemblyVersion = 'AssemblyVersion("' + $baseVersion + '.*")'
            $NewAssemblyInformationalVersion = 'AssemblyInformationalVersion("' + $Version + '")'
            foreach ($o in $input) {
              Write-Output "  $($o.FullName)"
              $TmpFile = $o.FullName + ".tmp"
              Get-Content $o.FullName |
                ForEach-Object { $_ -replace 'AssemblyVersion\(".*"\)', $NewAssemblyVersion } |
                ForEach-Object { $_ -replace 'AssemblyInformationalVersion\(".*"\)', $NewAssemblyInformationalVersion } > $TmpFile
              Move-Item $TmpFile $o.FullName -Force
            }
          }

          $count = 0
          foreach ($file in "AssemblyInfo.cs", "AssemblyInfo.vb") {
            $found = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse | Where-Object { $_.Name -eq $file }
            $count += @($found).Count
            $found | Update-SourceVersion $env:VERSION
          }

          if ($count -eq 0) {
            Add-Content -Path $summary -Value "⚠️ No AssemblyInfo.cs / AssemblyInfo.vb files found.`n"
          } else {
            Add-Content -Path $summary -Value "- Updated $count AssemblyInfo file(s) to ``$($env:VERSION)``.`n"
          }
        }
        catch {
          $err = "update-assembly-info failed: $($_.Exception.Message)"
          Write-Error $err
          Add-Content -Path $summary -Value "❌ $err`n"
          exit 1
        }
