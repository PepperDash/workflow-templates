name: Publish to NuGet.org
description: >
  Pushes every .nupkg in the output dir to nuget.org — but ONLY when the repo is
  owned by PepperDash AND is public. This runtime gate is fail-closed and is the
  single source of truth for public publishing; there is no caller opt-in.

inputs:
  nuget-api-key:
    description: 'nuget.org API key.'
    required: true
  output-dir:
    description: 'Directory containing the .nupkg files.'
    required: false
    default: 'output'
  required-owner:
    description: 'Owner that is allowed to publish publicly (case-insensitive).'
    required: false
    default: 'pepperdash'

runs:
  using: composite
  steps:
    - name: Push to NuGet.org (public PepperDash repos only)
      shell: pwsh
      run: |
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Nuget.org`n"

        $owner = "${{ github.repository_owner }}"
        $visibility = "${{ github.event.repository.visibility }}"
        Write-Output "Repository Owner: $owner"
        Write-Output "Repository Visibility: $visibility"

        if ($owner.ToLower() -ne "${{ inputs.required-owner }}".ToLower() -or $visibility.ToLower() -ne 'public') {
          $msg = "Repository is not a public ${{ inputs.required-owner }} repo; skipping publish to NuGet.org."
          Write-Warning $msg
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $msg
          exit 0
        }

        $nupkgFiles = Get-ChildItem -Path .\${{ inputs.output-dir }} -Recurse -Filter *.nupkg
        if ($nupkgFiles.Count -eq 0) {
          $msg = "No .nupkg files found in .\${{ inputs.output-dir }}."
          Write-Error $msg
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $msg
          exit 1
        }

        nuget setApiKey ${{ inputs.nuget-api-key }} -Source https://api.nuget.org/v3/index.json
        $nupkgFiles | ForEach-Object {
          Write-Output "Pushing $($_.Name) to NuGet.org..."
          nuget push $_.FullName -Source https://api.nuget.org/v3/index.json -SkipDuplicate
        }
        Write-Output "Published ${{ github.repository }} to NuGet.org" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
