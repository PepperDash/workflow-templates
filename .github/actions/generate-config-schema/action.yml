name: Generate config schema
description: >
  Generates JSON Schema for a 4-Series Essentials plugin's configuration classes.
  Config roots are auto-detected from `dc.Properties.ToObject<T>()` call sites in
  the plugin source; a small NJsonSchema tool then reflects the compiled types.
  4-Series only (needs the built assembly to load).

inputs:
  assembly-name:
    description: 'Primary plugin assembly base name (from get-plugin-metadata). Blank = auto-detect.'
    required: false
    default: ''
  build-type:
    description: 'Release or Debug — used to locate the built assembly.'
    required: false
    default: 'Release'
  types:
    description: 'Explicit semicolon-separated config type names. Blank = auto-detect from source.'
    required: false
    default: ''
  output-dir:
    description: 'Directory (relative to the workspace) to write <Type>.schema.json into.'
    required: false
    default: 'output/schemas'
  dotnet-version:
    description: '.NET SDK to run the generator with.'
    required: false
    default: '8.0.x'
  upload-artifact:
    description: 'Upload the schemas as a workflow artifact.'
    required: false
    default: 'true'

outputs:
  schema-dir:
    description: 'Directory the schema files were written to.'
    value: ${{ inputs.output-dir }}
  schema-count:
    description: 'Number of schema files produced.'
    value: ${{ steps.gen.outputs.schema-count }}

runs:
  using: composite
  steps:
    - name: Discover config types
      id: discover
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $summary = $env:GITHUB_STEP_SUMMARY
        try {
          if ("${{ inputs.types }}" -ne '') {
            "types=${{ inputs.types }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $found = @()
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.cs -File |
            Where-Object { $_.FullName -notmatch '\\(obj|bin|packages)\\' } |
            ForEach-Object {
              $text = Get-Content -Raw -Path $_.FullName
              foreach ($m in [regex]::Matches($text, '\.ToObject<\s*([A-Za-z_][A-Za-z0-9_.]*)\s*>\s*\(')) {
                $found += $m.Groups[1].Value
              }
            }
          $found = $found | Sort-Object -Unique
          "types=$($found -join ';')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($found.Count -eq 0) {
            Add-Content -Path $summary -Value "## Generate config schema`nNo ``ToObject<T>()`` call sites found; skipping.`n"
          } else {
            Write-Output "Config types: $($found -join ', ')"
          }
        }
        catch {
          $err = "generate-config-schema (discover) failed: $($_.Exception.Message)"
          Write-Error $err
          Add-Content -Path $summary -Value "❌ $err`n"
          exit 1
        }

    - name: Resolve assembly path
      id: asm
      if: steps.discover.outputs.types != ''
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $summary = $env:GITHUB_STEP_SUMMARY
        try {
          $name = "${{ inputs.assembly-name }}"
          $dlls = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.dll -File |
            Where-Object { $_.FullName -match "\\bin\\${{ inputs.build-type }}" -and $_.FullName -notmatch '\\packages\\' }
          $pick = $null
          if ($name -ne '') { $pick = $dlls | Where-Object { $_.BaseName -eq $name } | Select-Object -First 1 }
          if ($null -eq $pick) { $pick = $dlls | Sort-Object LastWriteTime -Descending | Select-Object -First 1 }
          if ($null -eq $pick) {
            $err = "Could not find a built plugin .dll under a bin\${{ inputs.build-type }} path."
            Write-Error $err
            Add-Content -Path $summary -Value "❌ $err`n"
            exit 1
          }
          "path=$($pick.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Assembly: $($pick.FullName)"
        }
        catch {
          $err = "generate-config-schema (resolve assembly) failed: $($_.Exception.Message)"
          Write-Error $err
          Add-Content -Path $summary -Value "❌ $err`n"
          exit 1
        }

    - name: Setup .NET
      if: steps.discover.outputs.types != ''
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Generate schemas
      id: gen
      if: steps.discover.outputs.types != ''
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $summary = $env:GITHUB_STEP_SUMMARY
        try {
          $outDir = Join-Path $env:GITHUB_WORKSPACE "${{ inputs.output-dir }}"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          dotnet run --project "${{ github.action_path }}/schema-gen/SchemaGen.csproj" -c Release -- `
            --assembly "${{ steps.asm.outputs.path }}" `
            --types "${{ steps.discover.outputs.types }}" `
            --out "$outDir"
          $exit = $LASTEXITCODE

          $count = (Get-ChildItem -Path $outDir -Filter *.schema.json -ErrorAction SilentlyContinue | Measure-Object).Count
          "schema-count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($exit -ne 0 -and $count -eq 0) {
            $err = "Schema generation failed (exit $exit) and produced no files."
            Write-Error $err
            Add-Content -Path $summary -Value "❌ $err`n"
            exit $exit
          }
          if ($exit -ne 0) {
            Add-Content -Path $summary -Value "⚠️ Schema generator exited $exit but $count file(s) were written.`n"
          }
        }
        catch {
          $err = "generate-config-schema (generate) failed: $($_.Exception.Message)"
          Write-Error $err
          Add-Content -Path $summary -Value "❌ $err`n"
          exit 1
        }

    - name: Upload schema artifact
      if: steps.discover.outputs.types != '' && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: config-schemas
        path: ${{ inputs.output-dir }}/*.schema.json
        if-no-files-found: warn
