name: Apply Essentials version prefix
description: >
  Encodes PepperDash Essentials compatibility into the plugin Major version:
  prefixed_major = (Essentials major * 1000) + semver_major. See
  .github/instructions/versioning-plan.instructions.md.

inputs:
  version:
    description: 'Plain semver from getversion, e.g. "2.3.1" or "2.3.1-beta.1".'
    required: true
  tag:
    description: 'Plain semver tag from getversion, e.g. "v2.3.1". Optional.'
    required: false
    default: ''
  essentials-major:
    description: >
      Essentials major to encode. Use "1" for 3-Series (always Essentials v1).
      Leave empty for 4-Series to auto-detect from the .4Series.csproj
      PepperDashEssentials PackageReference.
    required: false
    default: ''
  csproj-filter:
    description: 'Glob for the csproj to read when auto-detecting.'
    required: false
    default: '*.4Series.csproj'

outputs:
  version:
    description: 'Prefixed version, e.g. "2002.3.1".'
    value: ${{ steps.prefix.outputs.version }}
  tag:
    description: 'Prefixed tag, e.g. "v2002.3.1".'
    value: ${{ steps.prefix.outputs.tag }}
  essentials-major:
    description: 'The Essentials major that was applied.'
    value: ${{ steps.prefix.outputs.essentials-major }}

runs:
  using: composite
  steps:
    - name: Compute prefixed version
      id: prefix
      shell: pwsh
      run: |
        $inputVersion = "${{ inputs.version }}"
        $essentialsMajor = "${{ inputs.essentials-major }}"

        if ([string]::IsNullOrWhiteSpace($essentialsMajor)) {
          $csproj = Get-ChildItem -Path . -Filter "${{ inputs.csproj-filter }}" -Recurse | Select-Object -First 1
          if ($null -eq $csproj) {
            Write-Error "No csproj matching '${{ inputs.csproj-filter }}' found and no essentials-major supplied."
            exit 1
          }
          Write-Output "Reading Essentials version from $($csproj.FullName)"
          [xml]$xml = Get-Content $csproj.FullName
          $ref = $xml.Project.ItemGroup.PackageReference | Where-Object { $_.Include -eq "PepperDashEssentials" }
          if ($null -eq $ref) {
            Write-Error "No PackageReference for 'PepperDashEssentials' in $($csproj.Name)"
            exit 1
          }
          $essentialsMajor = [regex]::Match($ref.Version, "^(\d+)").Groups[1].Value
        }

        $essentialsMajor = [int]$essentialsMajor
        $baseMajor = $essentialsMajor * 1000

        $m = [regex]::Match($inputVersion, "^(\d+)\.(\d+)\.(\d+)(.*)")
        if (-not $m.Success) {
          Write-Error "Version '$inputVersion' does not match semver format"
          exit 1
        }
        $prefixedMajor = $baseMajor + [int]$m.Groups[1].Value
        $prefixedVersion = "$prefixedMajor.$($m.Groups[2].Value).$($m.Groups[3].Value)$($m.Groups[4].Value)"
        $prefixedTag = "v$prefixedVersion"

        Write-Output "Essentials major: $essentialsMajor (base $baseMajor)"
        Write-Output "Input version:    $inputVersion"
        Write-Output "Prefixed version: $prefixedVersion"
        Write-Output "Prefixed tag:     $prefixedTag"

        "version=$prefixedVersion"          | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "tag=$prefixedTag"                   | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "essentials-major=$essentialsMajor" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "VERSION=$prefixedVersion"          | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Essentials Version Prefix`n"
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Essentials Major**: $essentialsMajor`n"
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Input Version**: $inputVersion`n"
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Prefixed Version**: $prefixedVersion`n"
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Prefixed Tag**: $prefixedTag`n"
