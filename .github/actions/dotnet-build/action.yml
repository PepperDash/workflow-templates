name: dotnet build solution
description: >
  Runs `dotnet build` for a 4-Series solution, captures the log as an artifact,
  and writes a build summary. Fails the step on a non-zero exit code.

inputs:
  solution-file:
    description: 'Solution base name (no extension); "<name>.sln" is built from the repo root.'
    required: true
  build-type:
    description: 'Configuration: Release or Debug.'
    required: true
  version:
    description: 'Value passed as /p:Version.'
    required: true
  extra-args:
    description: 'Additional msbuild/dotnet args appended verbatim.'
    required: false
    default: ''
  package-tags:
    description: 'Space-separated tags to inject as /p:PackageTags (SDK pack).'
    required: false
    default: ''
  repository-url:
    description: 'Value for /p:RepositoryUrl and /p:PackageProjectUrl.'
    required: false
    default: ''
  release-notes:
    description: 'Value for /p:PackageReleaseNotes (e.g. "Factory TypeNames: a, b").'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Build
      id: build
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $summary = $env:GITHUB_STEP_SUMMARY
        try {
          Add-Content -Path $summary -Value "## Build Solution`n"

          $sln = ".\${{ inputs.solution-file }}.sln"
          if (-not (Test-Path -Path $sln)) {
            throw "Solution '$sln' not found at the repo root."
          }

          $args = @(
            'build', $sln,
            '/p:Platform=Any CPU',
            "/p:Configuration=${{ inputs.build-type }}",
            "/p:Version=${{ inputs.version }}",
            '/p:IncludeSourceRevisionInInformationalVersion=false'
          )
          if ("${{ inputs.package-tags }}"   -ne '') { $args += "/p:PackageTags=${{ inputs.package-tags }}" }
          if ("${{ inputs.repository-url }}" -ne '') {
            $args += "/p:RepositoryUrl=${{ inputs.repository-url }}"
            $args += "/p:PackageProjectUrl=${{ inputs.repository-url }}"
          }
          if ("${{ inputs.release-notes }}"  -ne '') { $args += "/p:PackageReleaseNotes=${{ inputs.release-notes }}" }
          $extra = "${{ inputs.extra-args }}"
          if ($extra -ne '') { $args += $extra.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries) }

          $buildOutput = dotnet @args -m 2>&1
          $exit = $LASTEXITCODE

          $buildOutput | Out-String | Write-Output
          $buildOutput | Out-String | Out-File -FilePath "build-output.log" -Encoding utf8

          if ($exit -eq 0) {
            Add-Content -Path $summary -Value "**BUILD SUCCESS**`n"
            Add-Content -Path $summary -Value "- **Configuration**: ${{ inputs.build-type }}`n"
            Add-Content -Path $summary -Value "- **Version**: ${{ inputs.version }}`n"
            Add-Content -Path $summary -Value "- **Solution**: ${{ inputs.solution-file }}.sln`n"
          }
          else {
            Add-Content -Path $summary -Value "❌ **BUILD FAILED** — exit code $exit. See the step log and the build-output-log artifact.`n"
            exit $exit
          }
        }
        catch {
          $err = "dotnet-build failed: $($_.Exception.Message)"
          Write-Error $err
          Add-Content -Path $summary -Value "❌ $err`n"
          exit 1
        }

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-output-log
        path: build-output.log
        retention-days: 30
        if-no-files-found: ignore
